name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --locked --all-extras --dev

    - name: Audit dependencies for known vulnerabilities
      run: uv audit --locked --preview-features audit-command

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Format with Ruff
      run: uv run ruff format --check .

    - name: Type check with Ty
      run: uv run ty check src tests

    - name: Check if tests exist
      id: check_tests
      run: |
        if [ -d "tests" ] && [ -n "$(ls -A tests 2>/dev/null)" ]; then
          echo "has_tests=true" >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
        fi

    - name: Run tests
      if: steps.check_tests.outputs.has_tests == 'true'
      run: uv run pytest tests/ -v

  # Students run uv-start on Windows and macOS, so build real projects there.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run tests
      run: uv run pytest tests/ -q

    - name: Scaffold one project of each kind
      run: |
        # A non-ASCII author name, as many students have.
        git config --global user.name "Zoë Łukasz 王芳"
        git config --global user.email "student@example.com"
        git config --global init.defaultBranch main
        cd "$RUNNER_TEMP"
        uv run --project "$GITHUB_WORKSPACE" uv-start smoke-lib
        uv run --project "$GITHUB_WORKSPACE" uv-start smoke-app -t app
        uv run --project "$GITHUB_WORKSPACE" uv-start smoke-data --data

    - name: Use the --data project like a student would
      run: |
        cd "$RUNNER_TEMP/smoke-data"
        ls -a
        uv run python -c "import numpy, pandas, matplotlib; print('imports ok')"
        for nb in $(find . -name "*.ipynb" -not -path "./.venv/*"); do
          uv run --with nbconvert jupyter nbconvert --to notebook --execute --output "$(basename "$nb" .ipynb)-run.ipynb" "$nb"
        done
        uv run python -c "import pathlib; [p.read_text(encoding='utf-8') for p in pathlib.Path('.').rglob('*') if p.is_file() and p.suffix in {'.md','.toml','.py','.ipynb'} and '.venv' not in p.parts]; print('all text files are valid UTF-8')"

    - name: Library project keeps the author name and its tests pass
      run: |
        cd "$RUNNER_TEMP/smoke-lib"
        uv run python -c "import pathlib; t = pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); assert 'Zoë Łukasz 王芳' in t, 'author name mangled'; print('author name intact')"
        uv run pytest -q
