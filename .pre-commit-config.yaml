# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# template/.pre-commit-config.yaml
repos:
# Hook versions are held at least 7 days behind the newest release, the
# same cooldown uv applies to packages (see `uv-start --upgrade`).
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
        - id: uv-lock  # keep uv.lock in step with pyproject.toml
-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
        - id: commitizen-branch
          stages: [pre-push]
          # This only checks if commits follow the conventional commits format
          # without doing any version bumping

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-yaml
          args: [--allow-multiple-documents, --unsafe]  # Add --unsafe to allow duplicate keys
          exclude: ^src/uv_start/template/napari\.yaml$
        - id: check-toml
          exclude: ^(template/mypy-config\.toml|src/uv_start/template/napari-entry-points\.toml)$
        - id: check-added-large-files
        - id: debug-statements
        - id: check-case-conflict
        - id: check-merge-conflict

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
        - id: ruff
          args: [--fix]
        - id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
        - id: mypy
          exclude: ^tests/

-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
        - id: codespell
          args: ["--write-changes"]  # Remove this if you prefer to review fixes manually
