name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # commitizen comes from the locked dev dependencies, not a fresh pip
      # install.
      - name: Install dependencies
        run: uv sync --locked --dev

      # commitizen reads every commit since the last tag and decides the
      # increment itself, so a trailing docs:/test: commit no longer hides a
      # feat: or fix: that came before it. Exit 21 (NO_INCREMENT) and 3
      # (NO_COMMITS_FOUND) mean "nothing to release"; anything else fails.
      - name: Attempt version bump (if applicable)
        id: bump
        run: |
          set +e
          uv run cz bump --yes
          status=$?
          set -e
          case $status in
            0)    echo "bumped=true" >> "$GITHUB_OUTPUT" ;;
            3|21) echo "Nothing to release."; echo "bumped=false" >> "$GITHUB_OUTPUT" ;;
            *)    exit $status ;;
          esac

      - name: Push changes
        run: git push --follow-tags

      - name: Build package
        if: steps.bump.outputs.bumped == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.bump.outputs.bumped == 'true'
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
