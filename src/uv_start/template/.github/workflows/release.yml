name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      # commitizen comes from the locked dev dependencies, not a fresh pip
      # install. The commit message is read in the shell, never interpolated
      # with ${{ }}, so it cannot inject commands.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Attempt version bump (if applicable)
        id: bump
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          if echo "$COMMIT_MSG" | grep -qE "^(fix|feat|refactor|perf)(\([^)]+\))?\!?: "; then
            echo "Conventional commit detected – bumping version."
            uv run cz bump --yes || echo "No version bump occurred."
          else
            echo "Non-bump commit type – skipping version bump."
          fi

      - name: Push changes
        run: git push --follow-tags
